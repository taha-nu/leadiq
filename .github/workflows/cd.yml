name: CD

# Runs after CI passes on main (or by hand).
#  1. Builds the API and dashboard images and pushes them to GitHub Container
#     Registry (ghcr.io). The API image includes the served models from the
#     `model-latest` release (src/publish_model.py).
#  2. The AWS EC2 server pulls the new images by itself within 2 minutes
#     (deploy/update.sh), so GitHub needs no AWS credentials.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-push:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # push to ghcr.io
    steps:
      - uses: actions/checkout@v5

      - name: Download the served models
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download model-latest --pattern serving.tar.gz --dir models
          tar -xzf models/serving.tar.gz -C models
          cat models/serving/serving.json

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push images
        run: |
          for svc in api dashboard; do
            image=ghcr.io/taha-nu/leadiq-$svc
            docker build -f docker/$svc.Dockerfile \
              --label org.opencontainers.image.source=https://github.com/${{ github.repository }} \
              -t $image:${{ github.sha }} -t $image:latest .
            docker push --all-tags $image
          done
